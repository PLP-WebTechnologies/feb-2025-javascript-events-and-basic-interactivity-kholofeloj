<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Event Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="container">
        <h1>JS Event Assignment</h1>
    </header>

    <main>
        <!-- This text changes color when you hover over it -->
        <section class="hover">
            <div class="container">
                <article>
                    <p id="hover-color-change">
                        This text changes color when you hover over it
                    </p>
                </article>
            </div>
        </section>

        <!-- This text changes color when you click on the button -->
        <section class="click">
            <div class="container">
                <article>
                    <p id="click-color-change">
                        This text changes color when you click on it
                    </p>
                </article>
                <button id="change-color">Change Text Color</button>
            </div>
        </section>

        <!-- This is a Slideshow -->
        <section class="slideShow">
            <div class="container">
                <div class="slide fade">
                    <img src="image-1.jpg" alt="slide 1">
                </div>
                <div class="slide fade">
                    <img src="image-2.png" alt="slide 2">
                </div>
                <div class="slide fade">
                    <img src="image-3.jpg" alt="slide 3">
                </div>
                <div class="slide fade">
                    <img src="image-4.jpg" alt="slide 4">
                </div>
                <div class="slide fade">
                    <img src="image-5.jpg" alt="slide 5">
                </div>
                <div class="slide fade">
                    <img src="image-6.jpg" alt="slide 6">
                </div>
                <div class="slide fade">
                    <img src="image-7.jpg" alt="slide 7">
                </div>

                <a class="prev">&#10094;</a>
                <a class="next">&#10095;</a>
            </div>
        </section>
        
        

    </main>

    <footer class="container">
        <p>&copy; 2025 Kholofelo J. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
